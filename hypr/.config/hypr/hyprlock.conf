$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
    grace = 0
    no_fade_in = false
}

# Blurred screenshot of the current desktop as the lock background.
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Password field, styled with the same border gradient as appearance.lua.
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    rounding = 10

    inner_color = rgba(0, 0, 0, 0.4)
    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    font_color = rgb(255, 255, 255)

    check_color = rgba(00ff99ee)
    fail_color = rgba(ff6633ee) rgba(ff0066ee) 40deg
    fail_text = $FAIL <b>($ATTEMPTS)</b>

    placeholder_text = <span foreground="##cad3f5">Password...</span>
    fade_on_empty = true

    position = 0, -140
    halign = center
    valign = center
}

# Clock.
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    font_size = 90
    font_family = $font
    color = rgba(255, 255, 255, 0.9)

    position = 0, 160
    halign = center
    valign = center
}

# Date.
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    font_size = 22
    font_family = $font
    color = rgba(255, 255, 255, 0.75)

    position = 0, 80
    halign = center
    valign = center
}

# Username.
label {
    monitor =
    text = $USER
    font_size = 16
    font_family = $font
    color = rgba(255, 255, 255, 0.6)

    position = 0, -60
    halign = center
    valign = center
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}
